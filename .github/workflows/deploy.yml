name: Security checks & Deploy to Azure

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
  RESOURCE_GROUP: ${{ secrets.RESOURCE_GROUP }}
  BACKEND_APP: squad-manager-backend
  FRONTEND_APP: squad-manager-frontend

jobs:
  # ── Security scanning ──────────────────────────────────────────────────────
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for gitleaks

      - name: Scan for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Python dependency audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt --fix --dry-run

      - name: Node dependency audit
        run: |
          cd frontend
          npm audit --audit-level=high

  # ── Build & Deploy ─────────────────────────────────────────────────────────
  build-and-deploy:
    runs-on: ubuntu-latest
    needs: security-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build & push backend
        run: |
          docker build -t $ACR_REGISTRY/$BACKEND_APP:$GITHUB_SHA ./backend
          docker push $ACR_REGISTRY/$BACKEND_APP:$GITHUB_SHA

      - name: Build & push frontend
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=${{ secrets.API_URL }} \
            -t $ACR_REGISTRY/$FRONTEND_APP:$GITHUB_SHA ./frontend
          docker push $ACR_REGISTRY/$FRONTEND_APP:$GITHUB_SHA

      - name: Deploy backend to Container Apps
        run: |
          az containerapp update \
            --name $BACKEND_APP \
            --resource-group $RESOURCE_GROUP \
            --image $ACR_REGISTRY/$BACKEND_APP:$GITHUB_SHA

      - name: Deploy frontend to Container Apps
        run: |
          az containerapp update \
            --name $FRONTEND_APP \
            --resource-group $RESOURCE_GROUP \
            --image $ACR_REGISTRY/$FRONTEND_APP:$GITHUB_SHA
